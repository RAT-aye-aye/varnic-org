<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161d">
<title>HTML Lab — varnic.org</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1f29;
    --panel-2: #232936;
    --line: rgba(255,255,255,.07);
    --ink: #e9ecf3;
    --muted: #8f95a6;
    --accent: #7dbf63;
    --accent-2: #5aa8e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #1c2030 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 14px 8px;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .note { font-size: 11.5px; color: var(--muted); margin-left: auto; }
  .back {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 9px;
    white-space: nowrap;
  }
  .back:hover { color: var(--ink); border-color: rgba(255,255,255,.2); }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    padding: 6px 12px 10px;
  }
  section {
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .bar .grow { flex: 1 1 auto; }
  .bar .label { font-size: 12px; color: var(--muted); }

  button, select {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button.primary { background: rgba(125,191,99,.18); border-color: rgba(125,191,99,.4); color: #c9edbb; }
  select { padding: 7px 6px; max-width: 150px; }

  textarea {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    resize: none;
    border: 0;
    outline: 0;
    padding: 12px;
    background: #0e1118;
    color: #dbe3f0;
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
    font-size: 13px;
    line-height: 1.5;
    tab-size: 2;
  }
  iframe {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    border: 0;
    background: #fff;
  }
  .auto { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .auto input { accent-color: var(--accent); }

  footer {
    flex: 0 0 auto;
    padding: 0 14px max(10px, env(safe-area-inset-bottom));
    font-size: 11.5px;
    color: #6d7383;
  }
  footer strong { color: var(--muted); font-weight: 600; }
  footer code {
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    background: rgba(255, 255, 255, .05);
    padding: 1px 5px;
    border-radius: 5px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translate(-50%, 10px);
    z-index: 50;
    padding: 9px 16px;
    border-radius: 999px;
    background: #0b120d;
    color: #c6ffb8;
    border: 1px solid rgba(125, 191, 99, .4);
    font-size: 12.5px;
    font-weight: 600;
    max-width: min(92vw, 560px);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 820px) {
    main {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 44%) minmax(0, 56%);
    }
    header h1 { font-size: 15px; }
    header .note { display: none; }
  }
</style>
</head>
<body>
  <header>
    <a class="back" href="../">← varnic.org</a>
    <h1>HTML Lab</h1>
    <span class="note">runs entirely in your browser</span>
  </header>

  <main>
    <section>
      <div class="bar">
        <select id="examples" aria-label="Load an example">
          <option value="hello">Example: card</option>
          <option value="canvas">Example: canvas</option>
          <option value="clock">Example: clock</option>
        </select>
        <button id="open" title="Open an HTML file from this device">Open file</button>
        <span class="grow"></span>
        <button id="share" title="Copy a link that contains this code">Share link</button>
        <button id="run" class="primary" title="Ctrl/Cmd + Enter">Run ▶</button>
        <button id="download">Download</button>
        <button id="reset">Reset</button>
      </div>
      <input type="file" id="file" accept=".html,.htm,.txt,text/html,text/plain" hidden>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="HTML source"></textarea>
    </section>

    <section>
      <div class="bar">
        <span class="label">Preview</span>
        <span class="grow"></span>
        <label class="auto"><input type="checkbox" id="auto" checked> auto-run</label>
      </div>
      <iframe id="out" title="Live preview" sandbox="allow-scripts allow-modals allow-forms"></iframe>
    </section>
  </main>

  <footer>
    <strong>Public page:</strong> a share link looks like <code>/lab/#code=z:…</code> — that is your code compressed and packed into the URL, not gibberish. Anyone with the link can read it. Files you open stay on your device; nothing is uploaded to a server.
  </footer>

<script>
(function () {
  'use strict';

  var STORE = 'lab.code.v1';

  var EXAMPLES = {
    hello: [
      '<!DOCTYPE html>',
      '<html>',
      '<head>',
      '<style>',
      '  body { font-family: system-ui, sans-serif; background: #101522; color: #eef2f8;',
      '         display: grid; place-items: center; height: 100vh; margin: 0; }',
      '  .card { background: #1b2233; padding: 28px 34px; border-radius: 16px;',
      '          text-align: center; box-shadow: 0 14px 40px rgba(0,0,0,.45); }',
      '  h1 { margin: 0 0 6px; font-size: 22px; }',
      '  p { margin: 0 0 18px; color: #9aa4b8; font-size: 14px; }',
      '  button { font: inherit; padding: 10px 18px; border: 0; border-radius: 9px;',
      '           background: #58a6ff; color: #08111f; font-weight: 700; cursor: pointer; }',
      '</style>',
      '</head>',
      '<body>',
      '  <div class="card">',
      '    <h1>Hello from the lab</h1>',
      '    <p>Edit the code, then hit Run.</p>',
      '    <button id="b">Clicked 0 times</button>',
      '  </div>',
      '  <script>',
      '    let n = 0;',
      '    document.getElementById("b").onclick = (e) => {',
      '      n++; e.target.textContent = "Clicked " + n + " times";',
      '    };',
      '  <\/script>',
      '</body>',
      '</html>'
    ].join('\n'),

    canvas: [
      '<!DOCTYPE html>',
      '<html>',
      '<body style="margin:0;overflow:hidden;background:#08101a">',
      '  <canvas id="c"></canvas>',
      '  <script>',
      '    const c = document.getElementById("c");',
      '    const ctx = c.getContext("2d");',
      '    let w, h;',
      '    function fit() { w = c.width = innerWidth; h = c.height = innerHeight; }',
      '    addEventListener("resize", fit); fit();',
      '',
      '    const stars = Array.from({ length: 90 }, () => ({',
      '      x: Math.random(), y: Math.random(), r: Math.random() * 1.8 + 0.4,',
      '      s: Math.random() * 0.0006 + 0.0002',
      '    }));',
      '',
      '    function frame(t) {',
      '      ctx.fillStyle = "#08101a";',
      '      ctx.fillRect(0, 0, w, h);',
      '      for (const st of stars) {',
      '        st.y += st.s * 16;',
      '        if (st.y > 1) st.y -= 1;',
      '        const a = 0.35 + 0.65 * Math.abs(Math.sin(t / 900 + st.x * 9));',
      '        ctx.globalAlpha = a;',
      '        ctx.fillStyle = "#bfe3ff";',
      '        ctx.beginPath();',
      '        ctx.arc(st.x * w, st.y * h, st.r, 0, Math.PI * 2);',
      '        ctx.fill();',
      '      }',
      '      requestAnimationFrame(frame);',
      '    }',
      '    requestAnimationFrame(frame);',
      '  <\/script>',
      '</body>',
      '</html>'
    ].join('\n'),

    clock: [
      '<!DOCTYPE html>',
      '<html>',
      '<body style="margin:0;height:100vh;display:grid;place-items:center;',
      '             background:#11151d;color:#e8eefc;font-family:ui-monospace,monospace">',
      '  <div style="text-align:center">',
      '    <div id="t" style="font-size:clamp(32px,9vw,64px);letter-spacing:2px"></div>',
      '    <div id="d" style="margin-top:8px;color:#7f8aa3;font-size:14px"></div>',
      '  </div>',
      '  <script>',
      '    function tick() {',
      '      const now = new Date();',
      '      document.getElementById("t").textContent = now.toLocaleTimeString();',
      '      document.getElementById("d").textContent = now.toDateString();',
      '    }',
      '    tick(); setInterval(tick, 1000);',
      '  <\/script>',
      '</body>',
      '</html>'
    ].join('\n')
  };

  var codeEl = document.getElementById('code');
  var outEl = document.getElementById('out');
  var autoEl = document.getElementById('auto');
  var runBtn = document.getElementById('run');
  var openBtn = document.getElementById('open');
  var fileEl = document.getElementById('file');
  var shareBtn = document.getElementById('share');

  var toastEl = null;
  function showToast(message) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.id = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(showToast._hide);
    showToast._hide = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2200);
  }

  /* ---------- share links: the code lives in the #fragment, which is never sent to a server ---------- */

  function toB64url(bytes) {
    var binary = '';
    for (var i = 0; i < bytes.length; i += 0x8000) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromB64url(text) {
    var b64 = text.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function encodeShare(text) {
    var bytes = new TextEncoder().encode(text);
    if (typeof CompressionStream === 'function') {
      try {
        var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        var packed = new Uint8Array(await new Response(stream).arrayBuffer());
        return 'z:' + toB64url(packed);
      } catch (e) { /* fall back to plain base64url */ }
    }
    return toB64url(bytes);
  }

  async function decodeShare(token) {
    var packed = token.slice(0, 2) === 'z:';
    var bytes = fromB64url(packed ? token.slice(2) : token);
    if (packed) {
      if (typeof DecompressionStream !== 'function') {
        throw new Error('This browser cannot read compressed share links.');
      }
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return new TextDecoder().decode(bytes);
  }

  function readShareToken() {
    var hash = location.hash || '';
    return hash.indexOf('#code=') === 0 ? hash.slice(6) : null;
  }

  function render() {
    outEl.srcdoc = codeEl.value;
  }

  var timer = null;
  function scheduleRender() {
    if (!autoEl.checked) return;
    clearTimeout(timer);
    timer = setTimeout(render, 700);
  }

  function load(text) {
    codeEl.value = text;
    try { localStorage.setItem(STORE, text); } catch (e) {}
    if (location.hash) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
    render();
  }

  // Restore the last snippet, or start with the card example.
  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  codeEl.value = saved || EXAMPLES.hello;
  render();

  // A #code= link restores exactly what the sender had.
  (async function restoreShared() {
    var token = readShareToken();
    if (!token) return;
    try {
      var text = await decodeShare(token);
      codeEl.value = text;
      try { localStorage.setItem(STORE, text); } catch (e) {}
      render();
      showToast('Loaded shared code');
    } catch (e) {
      showToast('That share link could not be read');
    }
  })();

  codeEl.addEventListener('input', function () {
    try { localStorage.setItem(STORE, codeEl.value); } catch (e) {}
    scheduleRender();
  });

  // Ctrl/Cmd + Enter runs immediately.
  codeEl.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      render();
    }
  });

  runBtn.addEventListener('click', render);

  autoEl.addEventListener('change', function () {
    if (autoEl.checked) render();
  });

  document.getElementById('examples').addEventListener('change', function (e) {
    var key = e.target.value;
    if (EXAMPLES[key]) load(EXAMPLES[key]);
  });

  document.getElementById('reset').addEventListener('click', function () {
    load(EXAMPLES.hello);
  });

  // Open a local .html file. It never leaves the device.
  openBtn.addEventListener('click', function () {
    fileEl.click();
  });

  fileEl.addEventListener('change', function () {
    var file = fileEl.files && fileEl.files[0];
    fileEl.value = '';
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) {
      showToast('That file is too large (4 MB max)');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      load(String(reader.result));
      showToast('Opened ' + file.name);
    };
    reader.onerror = function () {
      showToast('Could not read that file');
    };
    reader.readAsText(file);
  });

  // Share link: the whole snippet goes into the URL fragment.
  shareBtn.addEventListener('click', async function () {
    if (!codeEl.value.trim()) {
      showToast('Nothing to share yet');
      return;
    }
    shareBtn.disabled = true;
    try {
      var token = await encodeShare(codeEl.value);
      var hash = '#code=' + token;
      var url = location.origin + location.pathname + hash;
      try { history.replaceState(null, '', hash); } catch (e) {}
      var copied = false;
      try {
        await navigator.clipboard.writeText(url);
        copied = true;
      } catch (e) {
        try { window.prompt('Copy this share link (it contains your code, encoded):', url); } catch (e2) {}
      }
      if (url.length > 8000) {
        showToast(copied ? 'Link copied — code is inside it, and it is long' : 'Share link ready — some apps may cut it');
      } else {
        showToast(copied ? 'Share link copied — code is inside the link' : 'Share link ready — code is inside the link');
      }
    } catch (e) {
      showToast('Could not create the link');
    } finally {
      shareBtn.disabled = false;
    }
  });

  document.getElementById('download').addEventListener('click', function () {
    var blob = new Blob([codeEl.value], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'page.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });
})();
</script>
</body>
</html>
